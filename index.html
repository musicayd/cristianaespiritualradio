<!DOCTYPE html>
<html lang="es">

<head>

     
    <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Radio Cristiana Espiritual</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- ICON -->
    <link rel="shortcut icon" href="icon.png">

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ff7a00">
</head>

<body>

<!-- INTRO IMAGE -->
<div id="intro">

    <img src="intro.jpeg" alt="Intro">

</div>
    


    <!-- =========================
         PLAYER
    ========================== -->
    
<div id="player" class="app-container hidden">

        <!-- INSTALL -->

        <div class="header-actions">

            <button id="installBtn">

                ⬇️ Instalar App

            </button>

        </div>

        <!-- PORTADA -->

        <div class="cassette-box">

            <img 
                <img id="coverImage" src="portada.jpg" alt="Portada Radio">
            

        </div>

        <!-- INFO -->

        <div class="info-section">

            <h2 id="songTitle">

                Sincronizando...

            </h2>

            <p class="status">

                <span>●</span>

                EN VIVO

            </p>

        </div>

        <!-- LOGIN -->

        <button 
            id="loginBtn"
            class="pill-button white-btn"
        >

            <img
                src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png"
                class="google-icon"
                alt="Google"
            >

            Iniciar con Google

        </button>

        <!-- USER -->

        <div 
            id="userInfo"
            style="
                color:#aaa;
                font-size:0.9rem;
                text-align:center;
            "
        ></div>

        <!-- LIKES -->

      <button id="likeBtn" class="gloria-btn">

    ✨ Gloria a Dios ✨

    <span>
        Aleluya • Amén
    </span>

</button>

        <!-- PLAY -->

       <button
    id="playBtn"
    class="pill-button white-btn"
>

    PLAY

</button>



        <!-- AUDIO -->

        <audio id="audio"></audio>

    </div>

    <!-- APP -->

    <script src="app.js"></script>

<script src="https://pl30161577.effectivecpmnetwork.com/5b/64/d0/5b64d0ebe48432a6df8a07942af66d6f.js"></script>
     
</body>

</html>
